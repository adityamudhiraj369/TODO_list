<!DOCTYPE html>
<html>
<head>
<title>Goals & Todo List</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{ box-sizing:border-box; margin:0; padding:0;}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#667eea,#764ba2);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:520px;
}

.section{
margin-bottom:30px;
padding:20px;
border-radius:12px;
color:white;
background-size:cover;
background-position:center;
position:relative;
overflow:hidden;
box-shadow:0 6px 15px rgba(0,0,0,0.2);
}

.section::before{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.45);
z-index:0;
}

.section *{ position:relative; z-index:1;}

.section:nth-child(1){
background-image:url("https://images.unsplash.com/photo-1484480974693-6ca0a78fb36b");
}

.section:nth-child(2){
background-image:url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee");
}

.section:nth-child(3){
background-image:url("https://images.unsplash.com/photo-1500534314209-a25ddb2bd429");
}

h2{
text-align:center;
margin-bottom:5px;
}

.quote{
text-align:center;
font-size:13px;
color:#ddd;
font-style:italic;
margin-bottom:15px;
}

.inputBox{
display:flex;
gap:10px;
}

textarea{
flex:1;
padding:10px;
border-radius:8px;
border:none;
font-size:14px;
outline:none;
resize:none;
height:40px;
}

button{
padding:10px 16px;
border:none;
border-radius:8px;
background:#667eea;
color:white;
font-weight:600;
cursor:pointer;
}

ul{
list-style:none;
margin-top:15px;
}

li{
padding:12px;
margin-top:10px;
background:white;
border-radius:8px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 6px rgba(0,0,0,0.2);
color:black;
}

.task-left{
display:flex;
align-items:center;
gap:10px;
}

.number{
font-weight:bold;
color:#667eea;
}

.completed{
background:#d4edda;
text-decoration:line-through;
color:#555;
}

.actions{
display:flex;
gap:8px;
align-items:center;
}

.completeBtn{
background:#28a745;
padding:6px 10px;
border-radius:6px;
font-size:12px;
}

.deleteCross{
cursor:pointer;
font-size:16px;
}

.prevBtn{
margin-top:10px;
width:100%;
padding:8px;
border:none;
border-radius:6px;
background:#333;
color:white;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<div class="section">
<h2>Todo List</h2>
<div class="quote">"Small progress every day leads to big success."</div>

<div class="inputBox">
<textarea id="todoInput"></textarea>
<button onclick="addTask('todoInput','todoList')">Add</button>
</div>

<ul id="todoList"></ul>
</div>

</div>

<script>

function updateNumbers(listId){
let tasks=document.querySelectorAll("#"+listId+" li");
tasks.forEach((task,index)=>{
task.querySelector(".number").innerText=index+1;
});
}

function createTask(text,listId){

let li=document.createElement("li");

let left=document.createElement("div");
left.className="task-left";

let number=document.createElement("span");
number.className="number";

let taskText=document.createElement("span");
taskText.innerText=text;

taskText.onclick=function(){
li.classList.toggle("completed");
}

left.appendChild(number);
left.appendChild(taskText);

let actions=document.createElement("div");
actions.className="actions";

/* COMPLETE */
let completeBtn=document.createElement("button");
completeBtn.innerText="✔";
completeBtn.className="completeBtn";

completeBtn.onclick=function(){
li.classList.add("completed");
}

/* INSERT */
let insertBtn=document.createElement("button");
insertBtn.innerText="➕";
insertBtn.className="completeBtn";

insertBtn.onclick=function(){

let newTask=prompt("Enter new task:");
if(!newTask) return;

let newLi=createTask(newTask,listId);

/* 🔥 FIXED LINE */
li.after(newLi);

updateNumbers(listId);
}

/* DELETE */
let deleteBtn=document.createElement("span");
deleteBtn.innerHTML="❌";

deleteBtn.onclick=function(){
li.remove();
updateNumbers(listId);
}

actions.appendChild(completeBtn);
actions.appendChild(insertBtn);
actions.appendChild(deleteBtn);

li.appendChild(left);
li.appendChild(actions);

return li;
}

function addTask(inputId,listId){

let input=document.getElementById(inputId);

if(input.value.trim()===""){
alert("Enter something");
return;
}

let tasks=input.value.split("\n");

tasks.forEach(task=>{
if(task.trim()!==""){
let li=createTask(task.trim(),listId);
document.getElementById(listId).appendChild(li);
}
});

input.value="";

updateNumbers(listId);
}

</script>

</body>
</html>
