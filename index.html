<script>

function todayDate(){
return new Date().toISOString().slice(0,10);
}

function yesterdayDate(){
let d=new Date();
d.setDate(d.getDate()-1);
return d.toISOString().slice(0,10);
}

/* SAVE */
function saveTasks(listId){

let tasks=[];

document.querySelectorAll("#"+listId+" li").forEach(li=>{
tasks.push({
text: li.querySelector(".taskText").innerText,
completed: li.classList.contains("completed"),
date: new Date().getTime()
});
});

if(listId==="shortList"){
localStorage.setItem("shortGoals", JSON.stringify(tasks));
}
else if(listId==="longList"){
localStorage.setItem("longGoals", JSON.stringify(tasks));
}
else{
localStorage.setItem(listId+'-'+todayDate(), JSON.stringify(tasks));
}

}

/* LOAD */
function loadTasks(listId){

let tasks=[];
let now=new Date().getTime();

if(listId==="shortList"){
let data=JSON.parse(localStorage.getItem("shortGoals") || "[]");

tasks=data.filter(task=>{
return (now - task.date) <= (365 * 24 * 60 * 60 * 1000);
});

localStorage.setItem("shortGoals", JSON.stringify(tasks));
}

else if(listId==="longList"){
let data=JSON.parse(localStorage.getItem("longGoals") || "[]");

tasks=data.filter(task=>{
return (now - task.date) <= (10 * 365 * 24 * 60 * 60 * 1000);
});

localStorage.setItem("longGoals", JSON.stringify(tasks));
}

else{
tasks=JSON.parse(localStorage.getItem(listId+'-'+todayDate()) || "[]");
}

tasks.forEach(task=>{
addTaskFromStorage(task.text,task.completed,listId);
});

}

function loadPrevious(listId){
let tasks=JSON.parse(localStorage.getItem(listId+'-'+yesterdayDate())||"[]");

if(tasks.length===0){
alert("No data for yesterday!");
return;
}

document.getElementById(listId).innerHTML="";

tasks.forEach(task=>{
addTaskFromStorage(task.text,task.completed,listId);
});
}

function updateNumbers(listId){
let tasks=document.querySelectorAll("#"+listId+" li");

tasks.forEach((task,index)=>{
task.querySelector(".number").innerText=index+1;
});

saveTasks(listId);
}

/* ADD TASK */
function addTaskFromStorage(text,completed,listId){

let li=document.createElement("li");

let left=document.createElement("div");
left.className="task-left";

let number=document.createElement("span");
number.className="number";

let taskText=document.createElement("span");
taskText.className="taskText";
taskText.innerText=text;

taskText.onclick=function(){
li.classList.toggle("completed");
saveTasks(listId);
}

left.appendChild(number);
left.appendChild(taskText);

let actions=document.createElement("div");
actions.className="actions";

/* COMPLETE */
let completeBtn=document.createElement("button");
completeBtn.innerText="Completed";
completeBtn.className="completeBtn";

completeBtn.onclick=function(){
li.classList.add("completed");
saveTasks(listId);
}

/* ➕ INSERT (🔥 FIXED HERE) */
let insertBtn=document.createElement("button");
insertBtn.innerText="➕";
insertBtn.className="completeBtn";

insertBtn.onclick=function(){

let newTask=prompt("Enter new task:");
if(!newTask || newTask.trim()==="") return;

let newLi=addTaskFromStorage(newTask,false,listId);

/* 🔥 MAIN FIX */
this.closest("li").after(newLi);

updateNumbers(listId);
}

/* DELETE */
let deleteCross=document.createElement("span");
deleteCross.innerHTML="❌";
deleteCross.className="deleteCross";

deleteCross.onclick=function(){
li.remove();
updateNumbers(listId);
}

actions.appendChild(completeBtn);
actions.appendChild(insertBtn);
actions.appendChild(deleteCross);

li.appendChild(left);
li.appendChild(actions);

if(completed) li.classList.add("completed");

/* 🔥 IMPORTANT: return li */
document.getElementById(listId).appendChild(li);

updateNumbers(listId);

return li;
}

function addTask(inputId,listId){

let input=document.getElementById(inputId);

if(input.value.trim()===""){
alert("Enter something");
return;
}

let tasks=input.value.split("\n");

tasks.forEach(task=>{
if(task.trim()!==""){
addTaskFromStorage(task.trim(),false,listId);
}
});

input.value="";
}

window.onload=function(){
["todoList","shortList","longList"].forEach(loadTasks);
}

</script>
